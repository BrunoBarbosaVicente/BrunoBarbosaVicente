name: Gerar cobrinha das contribuições

on:
  schedule:
    - cron: '0 0 * * *'   # Todo dia à meia-noite UTC
  workflow_dispatch:       # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    # 🔑 PERMISSÃO ESSENCIAL PARA FAZER PUSH
    permissions:
      contents: write

    steps:
      - name: Gerar cobrinha
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: BrunoBarbosaVicente
          outputs: |
            output/github-snake.svg?color_snake=#000&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            output/github-snake-dark.svg?color_snake=#fff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
          # 👇 Isso faz o push automaticamente para a branch 'output'
          push: true
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
