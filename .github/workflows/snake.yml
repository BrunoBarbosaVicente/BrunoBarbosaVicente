name: Gerar cobrinha das contribuições

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 🔑 PASSO 1: Clonar o repositório (para poder fazer git push)
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # 🐍 PASSO 2: Gerar a cobrinha (os SVGs vão para a pasta output/)
      - name: Gerar cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: BrunoBarbosaVicente
          outputs: |
            output/github-snake.svg?color_snake=#fe8019&color_dots=#ebedf0,#ffebcc,#ffc266,#ff9900,#fe8019
            output/github-snake-dark.svg?color_snake=#fe8019&color_dots=#161b22,#4c2e10,#7e4a11,#b26715,#fe8019

      # 📤 PASSO 3: Criar/atualizar a branch 'output' e fazer push
      - name: Push para a branch output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Se a branch output já existe localmente, deleta
          git branch -D output || true
          # Cria uma branch órfã (sem histórico)
          git checkout --orphan output
          # Remove todos os arquivos do índice (limpa a branch)
          git rm -rf . || true
          # Copia os SVGs gerados para a raiz da branch
          cp -r output/* .
          # Adiciona e comita
          git add *.svg
          git commit -m "Atualizar cobrinha"
          # Força o push para a branch output (sobrescreve)
          git push --force origin HEAD:output
